name: macOS Build and Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test core behavior
        run: bash scripts/check.sh
      - name: Build universal macOS app
        run: bash scripts/build.sh
      - name: Package
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PreviewLingo-macOS
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
